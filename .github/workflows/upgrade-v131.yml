name: Upgrade V1.31 opponent watch

on:
  push:
    paths:
      - '.github/workflows/upgrade-v131.yml'
      - 'tools/patch_v131.py'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply V1.31 patch
        run: python3 tools/patch_v131.py
      - name: Validate JavaScript
        run: |
          python3 - <<'PY'
          import re
          c=open('index.html').read()
          m=re.search(r'<script>([\s\S]*?)</script>',c)
          assert m, 'script not found'
          open('/tmp/app.js','w').write(m.group(1))
          PY
          node --check /tmp/app.js
          grep -q 'id="view-opponent"' index.html
          grep -q 'function renderOpponent' index.html
          grep -q 'V1.31' index.html
      - name: Commit V1.31
        run: |
          git config user.name 'Hichame21'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html sw.js
          git commit -m 'Passe l’application en V1.31 avec veille équipe adverse'
          git push
